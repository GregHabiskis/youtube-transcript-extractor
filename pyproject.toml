[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "youtube-transcript-extractor"
version = "0.1.0"
description = "Extract clean timestamped YouTube transcripts with yt-dlp."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.121.0,<1.0",
  "requests>=2.32.0,<3.0",
  "uvicorn>=0.34.0,<1.0",
  "yt-dlp>=2026.7.4",
  "youtube-transcript-api>=1.2.4,<2.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0,<1.0",
  "pytest>=8.3.0,<9.0",
  "ruff>=0.9.0,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.vercel]
entrypoint = "api.index:app"

[tool.vercel.scripts]
build = "pnpm build"
